<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan | HOOPS ASIA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <a class="logo" href="index.html">HOOPS ASIA<span>.</span></a>
    <nav>
        <a href="index.html">Beranda</a>
        <a href="produk.html">Produk</a>
        <a href="tentang.html">Tentang</a>
        <a href="kontak.html">Kontak</a>
        <a href="pesan.html">Pesan</a>
    </nav>
</header>

<main class="container">
    <section class="form-section">
        <h1>Form Pemesanan</h1>
        <p>Silakan isi data berikut untuk memesan produk.</p>

        <form id="formPesanan">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required>

            <label for="produk">Pilih Produk</label>
            <select id="produk" required>
                <option value="">-- Pilih Produk --</option>
                <option value="Sneakers Putih">Kobe 9 Low Proto - Orange Frost</option>
                <option value="Running Shoes">Kobe 5 Proto Deep Royal Blue</option>
                <option value="Casual Shoes">JA 3 Hustle & Flow</option>
                <option value="Kaos Polos">Jersey Basket Pelita Jaya</option>
                <option value="Hoodie">Jersey Basket Satria Muda Pertamina</option>
                <option value="Kemeja Casual">Jersey Basket Dewa United Banten</option>
            </select>

            <label for="jumlah">Jumlah Barang</label>
            <input type="number" id="jumlah" min="1" value="1" required>

            <label for="alamat">Alamat Pengiriman</label>
            <textarea id="alamat" rows="4" placeholder="Masukkan alamat lengkap" required></textarea>

            <label for="telepon">Nomor Telepon</label>
            <input type="tel" id="telepon" placeholder="Masukkan nomor telepon" required>

            <button type="submit" class="btn">Pesan Sekarang</button>
        </form>

        <div id="pesanBerhasil" class="success-message" hidden>
            <h2>Pesanan Berhasil!</h2>
            <p id="detailPesanan"></p>
            <strong>Terima kasih telah berbelanja di HOOPS ASIA.</strong>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 HOOPS ASIA. All Rights Reserved.</p>
</footer>

<script>
    const form = document.getElementById("formPesanan");
    const pesanBerhasil = document.getElementById("pesanBerhasil");
    const detailPesanan = document.getElementById("detailPesanan");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const nama = document.getElementById("nama").value;
        const produk = document.getElementById("produk").value;
        const jumlah = document.getElementById("jumlah").value;
        const alamat = document.getElementById("alamat").value;
        const telepon = document.getElementById("telepon").value;

        detailPesanan.innerHTML =
            "Nama: " + nama + "<br>" +
            "Produk: " + produk + "<br>" +
            "Jumlah: " + jumlah + " barang<br>" +
            "Alamat: " + alamat + "<br>" +
            "Nomor Telepon: " + telepon;

        form.hidden = true;
        pesanBerhasil.hidden = false;
    });
</script>

</body>
</html>
